services:
  gameknife-community:
    image: ${GAMEKNIFE_COMMUNITY_IMAGE:-gameknife-community:local}
    build:
      context: ..
      dockerfile: docker/community.Dockerfile
      # WSL development environments often point HTTP_PROXY at 127.0.0.1:7890.
      # Host networking lets apt, npm, and pip reach that host proxy during the build.
      network: host
      args:
        TORCH_VERSION: ${TORCH_VERSION:-2.5.1}
        TORCHVISION_VERSION: ${TORCHVISION_VERSION:-0.20.1}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu124}
        GAMEKNIFE_APP_VERSION: ${GAMEKNIFE_APP_VERSION:-local}
        GAMEKNIFE_BUILD_NUMBER: ${GAMEKNIFE_BUILD_NUMBER:-local}
        GAMEKNIFE_GIT_SHA: ${GAMEKNIFE_GIT_SHA:-unknown}
        GAMEKNIFE_BUILD_TIME: ${GAMEKNIFE_BUILD_TIME:-unknown}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,gameknife-community,gameknife-stable-audio-sfx}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-localhost,127.0.0.1,gameknife-community,gameknife-stable-audio-sfx}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      GAMEKNIFE_STORAGE_ROOT: /data/storage
      GAMEKNIFE_DB_PATH: /data/storage/gameknife.sqlite3
      GAMEKNIFE_WEB_DIST: /app/apps/community-web/dist
      GAMEKNIFE_BIREFNET_MODEL_ROOT: /data/storage/models/birefnet
      GAMEKNIFE_UPSCALE_MODEL_ROOT: /data/storage/models/upscale
      GAMEKNIFE_STABLE_AUDIO_BASE_URL: http://gameknife-stable-audio-sfx:8090
      GAMEKNIFE_STABLE_AUDIO_TOKEN: ${GAMEKNIFE_STABLE_AUDIO_TOKEN:-}
      GAMEKNIFE_APP_VERSION: ${GAMEKNIFE_APP_VERSION:-local}
      GAMEKNIFE_BUILD_NUMBER: ${GAMEKNIFE_BUILD_NUMBER:-local}
      GAMEKNIFE_GIT_SHA: ${GAMEKNIFE_GIT_SHA:-unknown}
      GAMEKNIFE_BUILD_TIME: ${GAMEKNIFE_BUILD_TIME:-unknown}
      HF_HOME: /data/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      TRANSFORMERS_CACHE: /data/huggingface/transformers
      NVIDIA_VISIBLE_DEVICES: ${GAMEKNIFE_VISIBLE_GPUS:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HTTP_PROXY: ${GAMEKNIFE_CONTAINER_HTTP_PROXY:-}
      HTTPS_PROXY: ${GAMEKNIFE_CONTAINER_HTTPS_PROXY:-}
      NO_PROXY: ${GAMEKNIFE_CONTAINER_NO_PROXY:-localhost,127.0.0.1,gameknife-community,gameknife-stable-audio-sfx}
      http_proxy: ${GAMEKNIFE_CONTAINER_HTTP_PROXY:-}
      https_proxy: ${GAMEKNIFE_CONTAINER_HTTPS_PROXY:-}
      no_proxy: ${GAMEKNIFE_CONTAINER_NO_PROXY:-localhost,127.0.0.1,gameknife-community,gameknife-stable-audio-sfx}
    ports:
      - "${GAMEKNIFE_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./gameknife-storage:/data/storage
      - ./gameknife-huggingface:/data/huggingface
    # The host driver and NVIDIA Container Toolkit provide GPU access.
    # The container's CUDA and PyTorch runtimes do not replace the host driver.
    gpus: all
    depends_on:
      - gameknife-stable-audio-sfx

  gameknife-stable-audio-sfx:
    image: ${GAMEKNIFE_STABLE_AUDIO_SFX_IMAGE:-gameknife-stable-audio-sfx:local}
    build:
      context: ..
      dockerfile: docker/stable-audio-sfx.Dockerfile
      # The SFX build also needs pip network access, so it uses the same build network as the main service.
      network: host
      args:
        STABLE_AUDIO_TORCH_EXTRA_INDEX_URL: ${STABLE_AUDIO_TORCH_EXTRA_INDEX_URL:-https://download.pytorch.org/whl/cu126}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,gameknife-community,gameknife-stable-audio-sfx}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-localhost,127.0.0.1,gameknife-community,gameknife-stable-audio-sfx}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      GAMEKNIFE_STABLE_AUDIO_TOKEN: ${GAMEKNIFE_STABLE_AUDIO_TOKEN:-}
      GAMEKNIFE_STABLE_AUDIO_QUEUE_SIZE: ${GAMEKNIFE_STABLE_AUDIO_QUEUE_SIZE:-12}
      GAMEKNIFE_STABLE_AUDIO_GENERATION_TIMEOUT_SECONDS: ${GAMEKNIFE_STABLE_AUDIO_GENERATION_TIMEOUT_SECONDS:-900}
      GAMEKNIFE_STABLE_AUDIO_VISIBLE_GPUS: ${GAMEKNIFE_STABLE_AUDIO_VISIBLE_GPUS:-all}
      GAMEKNIFE_STABLE_AUDIO_MODEL_HALF: ${GAMEKNIFE_STABLE_AUDIO_MODEL_HALF:-1}
      GAMEKNIFE_STABLE_AUDIO_MODEL_ID: ${GAMEKNIFE_STABLE_AUDIO_MODEL_ID:-stabilityai/stable-audio-open-1.0}
      HF_HOME: /data/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      NVIDIA_VISIBLE_DEVICES: ${GAMEKNIFE_STABLE_AUDIO_VISIBLE_GPUS:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HTTP_PROXY: ${GAMEKNIFE_CONTAINER_HTTP_PROXY:-}
      HTTPS_PROXY: ${GAMEKNIFE_CONTAINER_HTTPS_PROXY:-}
      NO_PROXY: ${GAMEKNIFE_CONTAINER_NO_PROXY:-localhost,127.0.0.1,gameknife-community,gameknife-stable-audio-sfx}
      http_proxy: ${GAMEKNIFE_CONTAINER_HTTP_PROXY:-}
      https_proxy: ${GAMEKNIFE_CONTAINER_HTTPS_PROXY:-}
      no_proxy: ${GAMEKNIFE_CONTAINER_NO_PROXY:-localhost,127.0.0.1,gameknife-community,gameknife-stable-audio-sfx}
    ports:
      - "${GAMEKNIFE_STABLE_AUDIO_PORT:-8090}:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./gameknife-stable-audio-cache:/data/huggingface
    # The SFX service has its own worker pool; GAMEKNIFE_STABLE_AUDIO_VISIBLE_GPUS controls its GPU list.
    gpus: all
