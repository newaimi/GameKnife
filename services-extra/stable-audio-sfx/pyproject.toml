[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gameknife-stable-audio-sfx"
version = "0.1.0"
description = "GameKnife Stable Audio sound effect service"
requires-python = ">=3.10,<3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "numpy<2",
  "pytorch-lightning==2.5.5",
  "stable-audio-tools==0.0.20",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]
